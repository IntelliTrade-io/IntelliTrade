name: Frontend — lint, typecheck, test, build

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "types/**"
      - "sanity/**"
      - "styles/**"
      - "__tests__/**"
      - "public/**"
      - "middleware.ts"
      - "next.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.mjs"
      - "postcss.config.*"
      - "tailwind.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "types/**"
      - "sanity/**"
      - "styles/**"
      - "__tests__/**"
      - "public/**"
      - "middleware.ts"
      - "next.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.mjs"
      - "postcss.config.*"
      - "tailwind.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # These three need no secrets or network — always run.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `next build` statically generates the blog from Sanity (public read),
      # so it needs the two public NEXT_PUBLIC_SANITY_* values. They are not
      # secret (they ship to the browser) — add them as repo Actions *variables*
      # to activate this gate. Supabase/Stripe are placeholders: no page hits
      # them at build time (all such routes are force-dynamic / request-time).
      - name: Build
        if: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID != '' }}
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
        run: npm run build

  security-regression:
    # Guards audit finding C1: the anon key must not read premium tables.
    # The script self-skips until SUPABASE_URL + SUPABASE_ANON_KEY secrets exist.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Anon-key RLS regression check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/ci/anon-rls-check.mjs
