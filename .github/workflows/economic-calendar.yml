name: Economic Calendar — Scrape & Upload

on:
  schedule:
    # 06:00 UTC — before London open, catches Asian/European overnight releases
    - cron: "0 6 * * *"
    # 13:00 UTC — before NY open, refreshes for afternoon session
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase beautifulsoup4 lxml feedparser

      - name: Run scraper and upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/economic_calendar_upload.py \
            --since -1 \
            --until 30 \
            --central-banks \
            --global
